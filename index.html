    <script>
      function fetchWeather(lat, lon) {
        fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=41.8832&longitude=-87.6324&current=temperature_2m,weather_code&temperature_unit=fahrenheit`,
        )
          .then((res) => res.json())
          .then((data) => {
            const temp = data.current.temperature_2m;
            const code = data.current.weather_code;

            const conditions = {
              0: "Clear sky",
              1: "Mainly clear",
              2: "Partly cloudy",
              3: "Overcast",
              45: "Foggy",
              48: "Foggy",
              51: "Light drizzle",
              61: "Light rain",
              63: "Rain",
              71: "Light snow",
              73: "Snow",
              80: "Showers",
              95: "Thunderstorm",
            };
            const emojis = {
              0: "☀️",
              1: "🌤️",
              2: "⛅",
              3: "☁️",
              45: "🌫️",
              48: "🌫️",
              51: "🌦️",
              61: "🌧️",
              63: "🌧️",
              71: "🌨️",
              73: "❄️",
              80: "🌦️",
              95: "⛈️",
            };
            const condition = conditions[code] ?? "Unknown";
            const emoji = emojis[code] ?? "🌡️";

            document.getElementById("weather-widget").innerHTML = `
                  <div class="duo-header">
                    <span>${emoji}</span>
                    <span>Weather</span>
                    </div>
                    <p>${temp}°F - ${condition}</p>
                    <p><em>Chicago, IL</em></p>
                  `;
          });
      }

      fetchWeather(41.8832, -87.6324);

      const ghCard = new Image();
      /* ghCard.src =
          "https://github-readme-stats-fast.vercel.app/api?username=leemo-jeemo&theme=transparent&show_icons=true&hide_border=true&icon_color=ffffff&title_color=ffffff&text_color=666666&hide=prs,contribs,stars&hide_title=true&card_width=1"; */
      ghCard.style.width = "100%";
      ghCard.style.borderRadius = "8px";
      ghCard.onload = () => {
        if (ghCard.naturalWidth > 1) {
          document.getElementById("gh-card").appendChild(ghCard);
          document.getElementById("github-section").style.display = "block";
        }
      };
    </script>

    <script>
      const cards = document.querySelectorAll(".server-card");
      let current = Math.floor(Math.random() * cards.length);
      cards[current].classList.add("active");
      document.getElementById("next").addEventListener("click", () => {
        cards[current].classList.remove("active");
        current = (current + 1) % cards.length;
        cards[current].classList.add("active");
      });
      document.getElementById("prev").addEventListener("click", () => {
        cards[current].classList.remove("active");
        current = (current - 1 + cards.length) % cards.length;
        cards[current].classList.add("active");
      });
    </script>

      const currentTimeEl = document.getElementById("current-time");
      const durationEl = document.getElementById("duration");

      let isDragging = false;

      function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? "0" : ""}${s}`;
      }

      btn.addEventListener("click", () => {
        if (audio.paused) {
          audio.play();
          btn.textContent = "❚❚";
        } else {
          audio.pause();
          btn.textContent = "▶";
        }
      });

      audio.addEventListener("loadedmetadata", () => {
        durationEl.textContent = formatTime(audio.duration);
      });

      function updateProgress() {
        const percent = (audio.currentTime / audio.duration) * 100;

        bar.style.width = percent + "%";
        dot.style.left = percent + "%";

        currentTimeEl.textContent = formatTime(audio.currentTime);
      }

      audio.addEventListener("timeupdate", () => {
        if (!isDragging) updateProgress();
      });

      container.addEventListener("click", (e) => {
        const rect = container.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;

        audio.currentTime = percent * audio.duration;
      });

      dot.addEventListener("mousedown", () => {
        isDragging = true;
      });

      window.addEventListener("mouseup", (e) => {
        if (!isDragging) return;

        const rect = container.getBoundingClientRect();
        const percent = Math.min(
          Math.max((e.clientX - rect.left) / rect.width, 0),
          1,
        );

        audio.currentTime = percent * audio.duration;
        isDragging = false;
      });

      audio.addEventListener("ended", () => {
        btn.textContent = "▶";
      });
    </script>

      function fetchStats() {
        fetch(
          "https://duolingoapi.bigmurph2618.workers.dev/?username=leemo.jeemo",
        )
          .then((res) => res.json())
          .then((data) => {
            if (data.users && data.users[0]) {

                CACHE_KEY,
                JSON.stringify({ user, time: Date.now() }),

              renderStats(user);
              twemoji.parse(document.getElementById("duolingo-stats"), {
                base: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/",
              });
            }
          })
          .catch((err) => {
            console.error("Failed to fetch Duolingo stats:", err);
          });

      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        const { user, time } = JSON.parse(cached);

        twemoji.parse(document.getElementById("duolingo-stats"), {
          base: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/",
        });

      } else {
        fetchStats();

      setInterval(fetchStats, CACHE_TTL);

    <script>

      function createTodoElement(todo) {
        const li = document.createElement("li");
        li.style.display = "flex";

        li.style.gap = "8px";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";

          const res = await fetch(WORKER_URL, {
            method: "DELETE",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ id: todo.id }),
          });
          if (res.ok) {
            li.remove();
          } else {
            checkbox.checked = false;
            showToast("Failed to delete!");
          }
        });

        const span = document.createElement("span");
        span.textContent = todo.text;
        li.appendChild(checkbox);
        li.appendChild(span);
        return li;

          modalInput.placeholder = "Enter task...";
        }
        modalInput.value = "";

      async function addTodo(text) {
        const token = localStorage.getItem("auth_token");
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ text }),
        });
        if (res.ok) {
          const todo = await res.json();
          console.log(todo);
          const li = createTodoElement(todo[0]);
          document.getElementById("todo-list").appendChild(li);
        } else {
          alert("Failed to add todo!");
        }
      }

      document
        .getElementById("modal-cancel")
        .addEventListener("click", closeModal);

      modalConfirm.addEventListener("click", async () => {
        const value = modalInput.value.trim();
        if (!value) return;

        if (modalMode === "password") {
          localStorage.setItem("auth_token", value);
          closeModal();
          openModal("todo");
        } else if (modalMode === "quote") {
          const author = modalInput2.value.trim();
          if (!author) return;

          if (author.length > 50) {
            showToast("Author name is exceeding 50 characters.");
            return;
          }

          if (value.length > 200) {
            showToast("Quote is exceeding 200 characters.");
            return;
          }

          closeModal();
          await fetch(WORKER_URL + "quotes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ quote: value, author }),
          }).then((res) =>
            res.ok
              ? showToast("Quote submitted!")
              : showToast("Failed to submit quote!"),
          );
        } else {
          closeModal();
          await addTodo(value);

        toast.style.display = "block";
