<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,500;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <title>leemo</title>
    <style>
      html {
        scrollbar-width: none;
        scroll-behavior: smooth;
      }
      html::-webkit-scrollbar {
        display: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0d0d0d;

      }
      body::-webkit-scrollbar {

      }
      h1 {
        font-family: "DM Sans", sans-serif;
        font-size: 4rem;
        font-weight: 700;
        letter-spacing: -2px;
        color: #ffffff;
        margin: 0;
        text-align: center;

      .name-wrap {

        text-align: left;

      }
      #speech-bubble {
        position: absolute;
        top: -18px;

        transform: translateX(-50%);

        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #fff;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 0.9rem;
        white-space: nowrap;
      }
      .divider {
        width: 100%;
        max-width: 500px;
        border: none;
        border-top: 1px solid #2a2a2a;
        margin: 24px auto;
      }
      .card {
        width: 100%;
        max-width: 500px;
        padding: 0 24px;
        text-align: center;
        margin-top: 32px;
      }
      .socials {
        display: flex;
        gap: 16px;
        align-items: center;
        margin: 12px 0;
        justify-content: center;
      }
      .socials a svg {
        fill: #888;
        transition: fill 0.2s;
      }
      .socials img {
        filter: invert(1);
        transition: opacity 0.2s;
      }
      .socials a:hover img {
        opacity: 0.5;
      }
      .socials a:hover svg {
        fill: #fff;
      }
      .quote-block {
        font-style: italic;
        color: #666;
        font-size: 0.9rem;
        line-height: 1.6;
      }
      #author {
        color: #444;
        margin-top: 8px;
      }
      .banner-wrap {
        position: relative;
      }
      .banner {
        width: 100%;
        border-radius: 8px;
        object-fit: cover;
        aspect-ratio: 1920 / 941;
      }
      button {
        background: none;
        border: 1px solid #2a2a2a;
        color: #fff;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 4px;
      }
      button:hover {
        border-color: #666;
      }
      .server-name {
        color: #fff;
        font-weight: 700;
        margin: 10px 0 2px;
        text-align: left;
        font-family: "DM Sans", sans-serif;
        font-weight: 500;
      }
      .server-position {
        color: #666;
        font-size: 0.85rem;
        text-align: left;
        font-family: "DM Sans", sans-serif;
        font-weight: 500;
        font-style: italic;
      }
      .join-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #fff;
        color: #fff;
        padding: 8px 20px;
        border-radius: 999px;
        text-decoration: none;
        font-family: "DM Sans", sans-serif;
        font-weight: 500;
        font-size: 0.9rem;
        transition: opacity 0.2s;
        margin-top: 8px;
      }
      .roblox-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #fff;
        color: #fff;
        padding: 8px 20px;
        border-radius: 999px;
        text-decoration: none;
        font-family: "DM Sans", sans-serif;
        font-weight: 500;
        font-size: 0.9rem;
        transition: opacity 0.2s;
        margin-top: 8px;
      }
      .join-btn:hover {
        opacity: 0.8;
      }
      .join-icon {
        filter: invert(1);
      }
      .server-info {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
      }
      #mobile-warning {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0d0d0d;
        color: #666;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "DM Sans", sans-serif;
        font-size: 40rem;
        padding: 24px;
        z-index: 9999;
        text-align: center;
      }
      .profile-wrap {
        position: relative;
        width: 100%;
        margin: 0;
        border-radius: 12px;
        overflow: visible;
      }

      .profile-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        margin: 0 auto 6px;
      }
      .todo-section {
        align-items: center;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 24px 32px;
        font-family: "DM Sans", sans-serif;
        color: #666;
        font-size: 1rem;
        font-style: italic;
        min-width: 200px;
        width: 300px;
        overflow: auto;
      }
      .duo-section {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 24px 32px;
        text-align: center;
        font-family: "DM Sans", sans-serif;
        color: #666;
        font-size: 1rem;
        font-style: italic;
        min-width: 200px;
        overflow: auto;
        width: 300px;
      }
      .duo-section p {
        margin: 4px 0;
      }
      .duo-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .duo-header img {
        width: 36px;
        height: 36px;
      }
      .duo-header span {
        color: #fff;
        font-style: normal;
        font-weight: 700;
        font-size: 1.2rem;
      }
      .duo-section img.emoji {
        width: 1em;
        height: 1em;
        vertical-align: -0.1em;
      }
      .todo-header span {
        color: #fff;
        font-style: normal;
        font-weight: 700;
        font-size: 1.2rem;
        text-align: center;
      }
      .todo-header {
        display: flex;
        justify-content: center;
        margin-bottom: 14px;
      }
      #modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #modal-box {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 32px;
        width: min(100%, 500px);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 16px;
        font-family: "DM Sans", sans-serif;
      }
      #modal-title {
        color: #fff;
        font-size: 1.2rem;
        margin: 0;
      }
      #modal-input {
        background: #0d0d0d;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 10px 14px;
        color: #fff;
        font-family: "DM Sans", sans-serif;
        font-size: 1rem;
        outline: none;
      }
      #modal-buttons {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      #modal-cancel {
        border-color: #444;
        color: #666;
      }
      #modal-confirm {
        border-color: #fff;
        color: #fff;
      }
      #quote-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 16px;
        width: 100%;
      }
      #quote-input,
      #author-input {
        background: #0d0d0d;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 10px 14px;
        color: #fff;
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        outline: none;
      }
      #quote-input::placeholder,
      #author-input::placeholder {
        color: #444;
      }
      .github-section {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 24px 32px;
        text-align: center;
        font-family: "DM Sans", sans-serif;
        color: #666;
        font-size: 1rem;
        font-style: italic;
        min-width: 200px;
        width: 300px;
      }
      .weather-section {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 24px 32px;
        text-align: center;
        font-family: "DM Sans", sans-serif;
        color: #666;
        font-size: 1rem;
        font-style: italic;
        min-width: 200px;
        width: 300px;
      }
      .weather-section p {
        margin: 4px 0;
      }
      .stats-row {
        display: flex;
        flex-direction: row;
        gap: 24px;
        align-items: flex-start;
        margin-top: 24px;
        padding: 0 24px;
        width: 100%;
        justify-content: center;
      }
      .github-section img {
        width: 100%;
        border-radius: 8px;
      }
      .github-section .duo-header img {
        filter: invert(1);
        width: 36px;
        height: 36px;
      }
      .stats-inner-row {
        display: flex;
        flex-direction: row;
        gap: 24px;
        justify-content: center;
        width: 100%;
      }
      .left-col,
      .right-col {
        position: absolute;
        top: 40%;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .left-col {
        left: 25px;
      }
      .right-col {
        right: 25px;
      }
      .time-row {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        font-size: 0.75rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="modal-overlay" style="display: flex">
      <div id="modal-box">
        <h2 id="modal-title">Site Discontinued</h2>
        <p style="color: #aaa; margin: 0; line-height: 1.6">
          This site is archived and no longer updated. You can still view the
          content below.
        </p>
        <p id="popup-quote" class="quote-block" style="margin-top: 18px"></p>
        <p id="popup-author" style="color: #444; margin: 0"></p>
        <div id="modal-buttons" style="justify-content: center">
          <button id="modal-confirm">Acknowledge</button>
        </div>
      </div>
    </div>
    <div
      id="toast"
      style="
        display: none;
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        color: #fff;
        padding: 12px 24px;
        border-radius: 999px;
        font-family: &quot;DM Sans&quot;, sans-serif;
        font-size: 0.9rem;
        z-index: 99999;
      "
    ></div>
    <div class="card">
      <div class="name-wrap">
        <div class="profile-wrap" id="profile-wrap" style="display: none">
          <img id="profile-avatar" class="profile-avatar" src="" />
        </div>
        <span id="speech-bubble" style="display: none"></span>

        <h1>leemo</h1>
      </div>
      <div class="socials">
        <a href="https://github.com/leemo-jeemo"
          ><img src="assets/GitHub_Invertocat_Black.svg" width="32" height="32"
        /></a>
        <a href="https://discord.com/users/987136948722364416"
          ><img src="assets/Discord_Black.svg" width="32" height="32"
        /></a>
        <a href="https://www.roblox.com/users/1567155158/profile"
          ><img src="assets/Roblox_Black.svg" width="32" height="32"
        /></a>
      </div>
      <hr class="divider" />
      <div class="quote-block">
        <p id="quote"></p>
        <p id="author"></p>
      </div>
    </div>
    <div class="left-col">
      <div class="todo-section">
        <div class="todo-header">
          <span>To-Do List</span>
        </div>
        <ul id="todo-list"></ul>
        <button id="add-todo-btn">+ Add</button>
      </div>
      <div class="github-section" id="github-section" style="display: none">
        <div class="duo-header">
          <img
            src="assets/GitHub_Invertocat_Black.svg"
            style="filter: invert(1); width: 36px; height: 36px"
          />
          <span>GitHub Stats</span>
        </div>

        <div id="gh-card"></div>
      </div>
    </div>
    <div class="right-col">
      <div class="duo-section" id="duolingo-stats"></div>
      <div class="weather-section" id="weather-widget">Loading weather...</div>
    </div>
    <script>
      function fetchWeather(lat, lon) {
        fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=41.8832&longitude=-87.6324&current=temperature_2m,weather_code&temperature_unit=fahrenheit`,
        )
          .then((res) => res.json())
          .then((data) => {
            const temp = data.current.temperature_2m;
            const code = data.current.weather_code;

            const conditions = {
              0: "Clear sky",
              1: "Mainly clear",
              2: "Partly cloudy",
              3: "Overcast",
              45: "Foggy",
              48: "Foggy",
              51: "Light drizzle",
              61: "Light rain",
              63: "Rain",
              71: "Light snow",
              73: "Snow",
              80: "Showers",
              95: "Thunderstorm",
            };
            const emojis = {
              0: "☀️",
              1: "🌤️",
              2: "⛅",
              3: "☁️",
              45: "🌫️",
              48: "🌫️",
              51: "🌦️",
              61: "🌧️",
              63: "🌧️",
              71: "🌨️",
              73: "❄️",
              80: "🌦️",
              95: "⛈️",
            };
            const condition = conditions[code] ?? "Unknown";
            const emoji = emojis[code] ?? "🌡️";

            document.getElementById("weather-widget").innerHTML = `
                  <div class="duo-header">
                    <span>${emoji}</span>
                    <span>Weather</span>
                    </div>
                    <p>${temp}°F - ${condition}</p>
                    <p><em>Chicago, IL</em></p>
                  `;
          });
      }

      fetchWeather(41.8832, -87.6324);

      const ghCard = new Image();
      /* ghCard.src =
          "https://github-readme-stats-fast.vercel.app/api?username=leemo-jeemo&theme=transparent&show_icons=true&hide_border=true&icon_color=ffffff&title_color=ffffff&text_color=666666&hide=prs,contribs,stars&hide_title=true&card_width=1"; */
      ghCard.style.width = "100%";
      ghCard.style.borderRadius = "8px";
      ghCard.onload = () => {
        if (ghCard.naturalWidth > 1) {
          document.getElementById("gh-card").appendChild(ghCard);
          document.getElementById("github-section").style.display = "block";
        }
      };
    </script>
    <script>
      fetch("https://icy-shape-78e5.bigmurph2618.workers.dev/quotes")
        .then((res) => res.json())
        .then((quotes) => {
          const random = Math.floor(Math.random() * quotes.length);
          const quoteText = `"${quotes[random].quote}"`;
          const authorText = `— ${quotes[random].author}`;
          document.getElementById("quote").textContent = quoteText;
          document.getElementById("author").textContent = authorText;
          document.getElementById("popup-quote").textContent = quoteText;
          document.getElementById("popup-author").textContent = authorText;
        });
    </script>
    <script>
      fetch("https://api.lanyard.rest/v1/users/987136948722364416")
        .then((res) => res.json())
        .then((data) => {
          const user = data.data.discord_user;

          const activity = data.data.activities[0];
          if (activity && activity.state) {
            const bubble = document.getElementById("speech-bubble");
            bubble.textContent = activity.state;
            bubble.style.display = "block";
          }

          const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`;
          document.getElementById("profile-avatar").src = avatarUrl;

          document.getElementById("profile-wrap").style.display = "block";
        });
    </script>
    <script>
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        document.getElementById("mobile-warning").style.display = "flex";
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js"></script>
    <script>
      const CACHE_KEY = "duo_stats";
      const CACHE_TTL = 24 * 60 * 60 * 1000;

      function renderStats(user) {
        console.log(user.courses);
        const streak = user.streak;
        const spanish = user.courses.find((c) => c.learningLanguage === "es");
        const chess = user.courses.find((c) => c.learningLanguage === "chess");
        document.getElementById("duolingo-stats").innerHTML = `
          <div class="duo-header">
            <img src="assets/Duolingo_Icon_Black.svg" />
            <span>Duolingo Stats</span>
          </div>
            <p>${streak} day streak</p>
            ${spanish ? `<p>🇪🇸 ${spanish.xp} Spanish XP</p>` : ""}
      ${chess ? `<p>♟️ ${chess.xp} Chess XP</p>` : ""}`;
      }

      function fetchStats() {
        fetch(
          "https://duolingoapi.bigmurph2618.workers.dev/?username=leemo.jeemo",
        )
          .then((res) => res.json())
          .then((data) => {
            if (data.users && data.users[0]) {
              const user = data.users[0];
              localStorage.setItem(
                CACHE_KEY,
                JSON.stringify({ user, time: Date.now() }),
              );
              renderStats(user);
              twemoji.parse(document.getElementById("duolingo-stats"), {
                base: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/",
              });
            }
          })
          .catch((err) => {
            console.error("Failed to fetch Duolingo stats:", err);
          });
      }

      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        const { user, time } = JSON.parse(cached);
        renderStats(user);
        twemoji.parse(document.getElementById("duolingo-stats"), {
          base: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/",
        });
        if (Date.now() - time > CACHE_TTL) fetchStats();
      } else {
        fetchStats();
      }

      setInterval(fetchStats, CACHE_TTL);
    </script>
    <script>
      const WORKER_URL = "https://icy-shape-78e5.bigmurph2618.workers.dev/";
      function createTodoElement(todo) {
        const li = document.createElement("li");
        li.style.display = "flex";
        li.style.alignItems = "center";
        li.style.gap = "8px";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.addEventListener("change", async () => {
          const token = localStorage.getItem("auth_token");
          const res = await fetch(WORKER_URL, {
            method: "DELETE",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ id: todo.id }),
          });
          if (res.ok) {
            li.remove();
          } else {
            checkbox.checked = false;
            showToast("Failed to delete!");
          }
        });

        const span = document.createElement("span");
        span.textContent = todo.text;
        li.appendChild(checkbox);
        li.appendChild(span);
        return li;
      }

      fetch("https://icy-shape-78e5.bigmurph2618.workers.dev/")
        .then((res) => res.json())
        .then((todos) => {
          const list = document.getElementById("todo-list");
          todos.forEach((todo) => {
            list.appendChild(createTodoElement(todo));
          });
        });
    </script>
    <script>
      const overlay = document.getElementById("modal-overlay");
      const modalConfirm = document.getElementById("modal-confirm");

      function closeModal() {
        overlay.style.display = "none";
      }

      modalConfirm.addEventListener("click", closeModal);
    </script>
  </body>
